version: 2

models:
  - name: gold_driver_stats
    description: |
      Tabla gold de estadísticas anuales de pilotos de Fórmula 1.
      Cada fila corresponde a un piloto en una temporada concreta e incluye:
      - Número de carreras disputadas
      - Total de puntos
      - Número de victorias (finish_position = 1)
      - Número de podios (finish_position IN (1,2,3))
      - Número de poles (starting_grid = 1)
      - Posición media de llegada
      - Porcentajes de victorias y podios
      Incluye claves sustitutas y metadatos de carga.
    columns:
      - name: driver_stat_id
        description: "Clave sustituta única para la estadística de piloto y año (hash de driver_id y race_year)."
        tests:
          - unique
          - not_null
      - name: driver_id
        description: "Identificador único del piloto."
      - name: driver_name
        description: "Nombre completo del piloto."
      - name: driver_nationality
        description: "Nacionalidad del piloto."
      - name: race_year
        description: "Año de la temporada."
      - name: races_entered
        description: "Número de carreras disputadas por el piloto en la temporada."
      - name: total_points
        description: "Puntos totales sumados en la temporada."
      - name: wins
        description: "Número de victorias (primer puesto) en la temporada."
      - name: podiums
        description: "Número de podios (posiciones 1-3) en la temporada."
      - name: pole_positions
        description: "Número de poles (salidas desde la primera posición en parrilla) en la temporada."
      - name: avg_finish_position
        description: "Posición media de llegada en las carreras disputadas en la temporada."
      - name: win_percentage
        description: "Porcentaje de victorias respecto a carreras disputadas."
      - name: podium_percentage
        description: "Porcentaje de podios respecto a carreras disputadas."
      - name: loaded_at
        description: "Timestamp de carga de la fila."
#--------------------------------------gold_equipo_circuito----------------------------------------------
  - name: gold_equipo_circuito
    description: |
      Vista gold que recoge el desempeño histórico de cada equipo (constructor) en cada circuito de Fórmula 1.
      Incluye métricas agregadas como carreras disputadas, victorias, podios, puntos totales, puntos promedio y mejor posición lograda por equipo en cada circuito.
      Esta vista permite analizar la especialización y dominio de los equipos en cada trazado.
    columns:
      - name: circuit_id
        description: "Identificador único del circuito."
        tests:
          - not_null
      - name: circuit_name
        description: "Nombre oficial del circuito."
        tests:
          - not_null
      - name: constructor_id
        description: "Identificador único del constructor (equipo)."
        tests:
          - not_null
      - name: equipo
        description: "Nombre del equipo (constructor)."
        tests:
          - not_null
      - name: carreras_disputadas
        description: "Número de carreras disputadas por el equipo en el circuito."
        tests:
          - not_null
      - name: victorias
        description: "Número de victorias (primer puesto) del equipo en el circuito."
        tests:
          - not_null
      - name: podios
        description: "Número de podios (posiciones 1-3) del equipo en el circuito."
        tests:
          - not_null
      - name: puntos_totales
        description: "Puntos totales sumados por el equipo en el circuito."
        tests:
          - not_null
      - name: puntos_promedio
        description: "Promedio de puntos obtenidos por el equipo en el circuito."
      - name: mejor_posicion
        description: "Mejor posición lograda por el equipo en el circuito."
#-------------------------------------------gold_piloto_circuito--------------------------------------------

  - name: gold_piloto_circuito
    description: |
      Tabla gold que recoge el desempeño histórico de cada piloto en cada circuito de Fórmula 1.
      Incluye métricas agregadas como carreras disputadas, victorias, podios, puntos totales, puntos promedio, mejor posición y ranking de victorias por circuito.
      Permite analizar la especialización y dominio de los pilotos en cada trazado.
    columns:
      - name: driver_id
        description: "Identificador único del piloto."
        tests:
          - not_null
      - name: piloto
        description: "Nombre completo del piloto."
        tests:
          - not_null
      - name: circuit_id
        description: "Identificador único del circuito."
        tests:
          - not_null
      - name: circuit_name
        description: "Nombre oficial del circuito."
        tests:
          - not_null
      - name: carreras_disputadas
        description: "Número de carreras disputadas por el piloto en el circuito."
        tests:
          - not_null
      - name: victorias
        description: "Número de victorias (primer puesto) del piloto en el circuito."
        tests:
          - not_null
      - name: podios
        description: "Número de podios (posiciones 1-3) del piloto en el circuito."
        tests:
          - not_null
      - name: puntos_totales
        description: "Puntos totales sumados por el piloto en el circuito."
        tests:
          - not_null
      - name: puntos_promedio
        description: "Promedio de puntos obtenidos por el piloto en el circuito."
      - name: mejor_posicion
        description: "Mejor posición lograda por el piloto en el circuito."
      - name: ranking_victorias
        description: "Ranking del piloto en el circuito según número de victorias (1 = más victorias)."

